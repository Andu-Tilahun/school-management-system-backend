server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:postgresql://${DB_ADDRESS:localhost}:${DB_PORT:5432}/user_db
    user: postgres
    password: postgres
    schemas: public
    locations:
      - classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 1
        enable.idempotence: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 3600000          # 1 hour in milliseconds
  refresh-expiration: 300000   # leave as is or adjust as needed


kafka:
  topics:
    high: notifications-high
    standard: notifications

security:
  public-endpoints:
    - path: /api/internal/users/register
      method: POST
    - path: /api/internal/users/{id}
      method: GET
    - path: /api/internal/users/{id}/roles
      method: GET
    - path: /api/internal/users/{roleName}/role
      method: GET
app:
  admin:
    username: admin
    password: ChangeMe123!
    email: admin@example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.tool.schema: DEBUG
    org.hibernate.SQL: DEBUG
